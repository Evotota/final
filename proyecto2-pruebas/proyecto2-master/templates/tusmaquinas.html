<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #F7F0E5;
      margin: 0;
      min-height: 100vh;
    }
    .navbar {
      background-color: #F7F0E5 !important;
    }
    ul {
      margin-left: 45px;
      margin-top: 48px;
    }
    .row {
      margin-top: 55px;
      margin-left: 55px;
      background-color: #F7F0E5 !important;
    }
    .col-6 {
      width: auto;
    }
    .botones {
      margin-top: 15px;
    }
    img {
      margin-top: 15px;
    }

    .crear_maquina {
      margin-top: 25px;
      margin-left: 80px;
    }

    .create {
      margin-left: 910px;
    }
  </style>
</head>

<body>
  <nav class="navbar bg-body-tertiary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="{{ url_for('static', filename='imagenes/sameva_logo.png') }}"" alt="Sameva Logo" width="200" height="100"
          class="d-inline-block align-text-top">
      </a>
    </div>
    <a href="{{ url_for('bton_crear') }}" type="button" class="btn btn-primary btn-lg crear_maquina create" name="crear">Crear Máquina</a>
  </nav>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}
  <div class="row justify-content-evenly">
    <div class="col-4 bg-info text-white p-5">
      <div class="container">
        <h5>Panel de Control</h5>
      </div>
      <div class="d-grid gap-2 col-6 mx-auto botones">
        <button class="btn btn-primary" type="button">Encender</button>
        <button class="btn btn-primary" type="button">Acceder</button>
        <button class="btn btn-primary" type="button">Apagar</button>
        <button class="btn btn-primary" type="button">Borrar</button>
        <button class="btn btn-primary" type="button">Copiar</button>
      </div>
    </div>
    <div class="col-4 bg-info text-white p-5">
      <div class="container-fluid">
        <h5>Tus Máquinas</h5>
      </div>
      <div class="accordion accordion-flush" id="accordionFlushExample">
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const maquinas = [
    {% for maquina in maquinas %}
      {
        nombre: "{{ maquina.nombre }}",
        ram_gb: {{ maquina.ram_gb }},
        disco_gb: {{ maquina.disco_gb }},
        cpu_nucleos: {{ maquina.cpu_nucleos }},
        so: "{{ maquina.so }}"
      }{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  const accordionContainer = document.getElementById("accordionFlushExample");

  maquinas.forEach((maquina, index) => {
    const id = `flush-collapse-${index}`;
    const accordionItem = document.createElement("div");
    accordionItem.classList.add("accordion-item");
    accordionItem.innerHTML = `
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
          data-bs-target="#\${id}" aria-expanded="false" aria-controls="\${id}">
          \${maquina.nombre}
        </button>
      </h2>
      <div id="\${id}" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
        <div class="accordion-body">
          <strong>Sistema Operativo:</strong> \${maquina.so}<br>
          <strong>RAM:</strong> \${maquina.ram_gb} GB<br>
          <strong>Disco:</strong> \${maquina.disco_gb} GB<br>
          <strong>CPU Núcleos:</strong> \${maquina.cpu_nucleos}
        </div>
      </div>
    `;
    accordionContainer.appendChild(accordionItem);
  });
</script>
</body>

</html>
